<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/graphiscan-favicon-cutout.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphiScan Admin</title>
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/graphiscan-logo.png" as="image" />
    <link rel="preload" href="/src/assets/admin-workspace-preview.png" as="image" />
    <style>
      :root{--admin-motion-quick:180ms;--admin-motion-enter:240ms;--admin-motion-ease:cubic-bezier(.23,1,.32,1)}
      html,body{margin:0;background:#fff}
      #admin-startup{position:fixed;inset:0;z-index:2147483647;background:#fff;transition:opacity var(--admin-motion-enter) var(--admin-motion-ease)}
      #admin-startup.ready{opacity:0;pointer-events:none}
      #admin-startup span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
      @media(prefers-reduced-motion:reduce){#admin-startup{transition:none}}
    </style>
  </head>
  <body>
    <div id="admin-startup" role="status"><span>Loading GraphiScan Admin</span></div>
    <div id="app" inert aria-busy="true"></div>
    <noscript>Enable JavaScript to open GraphiScan Admin.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
